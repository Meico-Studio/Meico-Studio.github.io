<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_2" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 453.59 511.7" overflow="visible" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      <![CDATA[
      .cls-1 {
        fill: none;
        stroke: #f2f7f9;
        stroke-miterlimit: 10;
        stroke-width: 22.35px;
      }
      .cls-2 { fill: #348dc6; }
      .cls-3 { fill: #e9f0f5; }

      /* Loop: 6s. Idle 0-0.3s, sequence 1 (0.3s-2.15s), sequence 2 (2.15s-4.0s), idle 4s-6s.
         The icon never disappears: every part stays on screen the whole time. */

      /* ================= SHIELD POPS, LOCK FOLLOWS (springy, staggered) ================= */
      .shield, .inner {
        transform-origin: 202.8px 231.9px;
        animation: shield-pop 6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .lock {
        transform-origin: 202.8px 253.2px;
        animation: lock-pop 6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      @keyframes shield-pop { /* the lock group shares this, so lock and shield move as one */
        0% { transform: scale(1.0); }
        5% { transform: scale(1.0); }
        7.5% { transform: scale(1.06); }
        10.5% { transform: scale(0.98); }
        13% { transform: scale(1.0); }
        35.83% { transform: scale(1.0); }
        38.33% { transform: scale(1.06); }
        41.33% { transform: scale(0.98); }
        43.83% { transform: scale(1.0); }
        100% { transform: scale(1.0); }
      }

      /* ================= SHACKLE WOBBLE (decaying jiggle) ================= */
      .shackle {
        transform-origin: 202.8px 205.0px;
        animation: shackle-wobble 6s ease-in-out infinite;
      }
      @keyframes shackle-wobble {
        0% { transform: rotate(0deg); }
        16.67% { transform: rotate(0deg); }
        18.17% { transform: rotate(-9deg); }
        19.67% { transform: rotate(6deg); }
        21.17% { transform: rotate(-4deg); }
        22.67% { transform: rotate(2deg); }
        24.17% { transform: rotate(0deg); }
        47.5% { transform: rotate(0deg); }
        49% { transform: rotate(-9deg); }
        50.5% { transform: rotate(6deg); }
        52% { transform: rotate(-4deg); }
        53.5% { transform: rotate(2deg); }
        55% { transform: rotate(0deg); }
        100% { transform: rotate(0deg); }
      }

      /* ================= LOCK: pops, then pulses once more ================= */
      @keyframes lock-pop {
        0% { transform: scale(1.0); }
        6.5% { transform: scale(1.0); }
        9% { transform: scale(1.2); }
        12% { transform: scale(0.93); }
        14.5% { transform: scale(1.0); }
        25% { transform: scale(1.0); }
        27% { transform: scale(1.1); }
        29.5% { transform: scale(0.97); }
        31.67% { transform: scale(1.0); }
        37.33% { transform: scale(1.0); }
        39.83% { transform: scale(1.2); }
        42.83% { transform: scale(0.93); }
        45.33% { transform: scale(1.0); }
        55.83% { transform: scale(1.0); }
        57.83% { transform: scale(1.1); }
        60.33% { transform: scale(0.97); }
        62.5% { transform: scale(1.0); }
        100% { transform: scale(1.0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .shield, .inner, .lock, .shackle { animation: none; }
      }
      ]]>
    </style>
  </defs>

  <g id="Layer_1-2" data-name="Layer 1">
    <g>
      <path class="cls-2 shield" d="M190.79,460.54C53.35,382.61-.57,289.42,0,98.55c.03-11.67,8.24-21.73,19.68-24.03C88.96,60.61,136.63,38.39,189.51,3.95c8.08-5.26,18.48-5.27,26.56-.01,52.99,34.45,100.66,56.67,169.84,70.58,11.43,2.3,19.63,12.35,19.68,24.01.7,190.89-53.22,284.08-190.8,362.02-7.44,4.21-16.56,4.21-24,0Z"/>
      <g class="inner">
        <path class="cls-1 shackle" d="M156.48,205.38v-45.43c0-62.92,92.64-62.92,92.64,0v45.43"/>
        <path class="cls-3 lock" d="M270.97,187.09h-136.36c-11.2,0-20.27,9.08-20.27,20.27v91.63c0,11.2,9.08,20.27,20.27,20.27h136.36c11.2,0,20.27-9.08,20.27-20.27v-91.63c0-11.2-9.08-20.27-20.27-20.27ZM212.65,261.87v19.27c0,5.45-4.41,9.85-9.85,9.85s-9.85-4.41-9.85-9.85v-19.27c-5.98-3.47-10.18-9.67-10.18-17.08,0-11.06,8.97-20.04,20.04-20.04s20.04,8.97,20.04,20.04c0,7.41-4.21,13.61-10.19,17.08Z"/>
      </g>
    </g>
  </g>
</svg>
