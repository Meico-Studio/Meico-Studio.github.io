<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-label="Animated red light bulb">
  <defs>
    <linearGradient id="bulb-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff314c"/>
      <stop offset="1" stop-color="#e6001f"/>
    </linearGradient>
    <style>
      .bulb { transform-box: fill-box; transform-origin: center; animation: bulb-breathe 4.8s ease-in-out infinite; }
      .shine { animation: shine 4.8s ease-in-out infinite; }
      @keyframes bulb-breathe { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-5px) rotate(1deg); } }
      @keyframes shine { 0%, 12%, 100% { opacity: .78; } 48% { opacity: .52; } }
      @media (prefers-reduced-motion: reduce) { .bulb, .shine { animation: none; } }
    </style>
  </defs>
  <g class="bulb">
    <path fill="url(#bulb-red)" d="M250 42c-88 0-145 66-145 151 0 58 26 92 69 130 20 18 28 34 29 55h94c1-21 9-37 29-55 43-38 69-72 69-130 0-85-57-151-145-151z"/>
    <path class="shine" fill="none" stroke="#ffb1bd" stroke-linecap="round" stroke-width="18" d="M175 117c-15 10-25 25-30 44"/>
    <path fill="#252526" d="M202 381h96a13 13 0 0 1 13 13v5a13 13 0 0 1-13 13h-96a13 13 0 0 1-13-13v-5a13 13 0 0 1 13-13zm9 34h78a12 12 0 0 1 12 12v4a12 12 0 0 1-12 12h-78a12 12 0 0 1-12-12v-4a12 12 0 0 1 12-12z"/>
  </g>
</svg>
