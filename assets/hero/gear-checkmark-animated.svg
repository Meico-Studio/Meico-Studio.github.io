<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_2" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 483.07 483.06" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      <![CDATA[
      .cls-1 { fill: #6d8598; }

      .cls-2 {
        fill: none;
        stroke: #4f6f82;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 26.35px;
      }

      /* Loop: 6s. Idle 0-0.3s, sequence 1 (0.3s-2.15s), sequence 2 (2.15s-4.0s), idle 4s-6s.
         The icon never disappears. The gear has 8 teeth, so each 45 degree step lands on
         an identical shape and the loop resets without a visible jump. */

      /* ================= GEAR: one springy tooth step per sequence ================= */
      .gear {
        transform-origin: 237.5px 237.5px;
        animation: gear-step 6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      @keyframes gear-step {
        0% { transform: rotate(0deg); }
        5% { transform: rotate(0deg); }
        13.33% { transform: rotate(45deg); }
        35.83% { transform: rotate(45deg); }
        44.17% { transform: rotate(90deg); }
        67.5% { transform: rotate(90deg); }
        67.67% { transform: rotate(0deg); }
        100% { transform: rotate(0deg); }
      }

      /* ================= CHECK: pops after the click, then wobbles ================= */
      .check {
        transform-origin: 237.5px 237.6px;
        animation: check-pop 6s ease-in-out infinite;
      }
      @keyframes check-pop {
        0% { transform: rotate(0deg) scale(1.0); animation-timing-function: ease-in-out; }
        9.17% { transform: rotate(0deg) scale(1.0); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
        11.67% { transform: rotate(0deg) scale(1.3); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
        14.67% { transform: rotate(0deg) scale(0.93); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
        17.17% { transform: rotate(0deg) scale(1.0); animation-timing-function: ease-in-out; }
        19.17% { transform: rotate(0deg) scale(1.0); animation-timing-function: ease-in-out; }
        20.67% { transform: rotate(-10deg) scale(1.0); animation-timing-function: ease-in-out; }
        22.17% { transform: rotate(7deg) scale(1.0); animation-timing-function: ease-in-out; }
        23.67% { transform: rotate(-4deg) scale(1.0); animation-timing-function: ease-in-out; }
        25.17% { transform: rotate(2deg) scale(1.0); animation-timing-function: ease-in-out; }
        26.67% { transform: rotate(0deg) scale(1.0); animation-timing-function: ease-in-out; }
        35.83% { transform: rotate(0deg) scale(1.0); animation-timing-function: ease-in-out; }
        40% { transform: rotate(0deg) scale(1.0); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
        42.5% { transform: rotate(0deg) scale(1.3); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
        45.5% { transform: rotate(0deg) scale(0.93); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
        48% { transform: rotate(0deg) scale(1.0); animation-timing-function: ease-in-out; }
        50% { transform: rotate(0deg) scale(1.0); animation-timing-function: ease-in-out; }
        51.5% { transform: rotate(-10deg) scale(1.0); animation-timing-function: ease-in-out; }
        53% { transform: rotate(7deg) scale(1.0); animation-timing-function: ease-in-out; }
        54.5% { transform: rotate(-4deg) scale(1.0); animation-timing-function: ease-in-out; }
        56% { transform: rotate(2deg) scale(1.0); animation-timing-function: ease-in-out; }
        57.5% { transform: rotate(0deg) scale(1.0); animation-timing-function: ease-in-out; }
        66.67% { transform: rotate(0deg) scale(1.0); animation-timing-function: ease-in-out; }
        100% { transform: rotate(0deg) scale(1.0); animation-timing-function: ease-in-out; }
      }

      @media (prefers-reduced-motion: reduce) {
        .gear, .check { animation: none; }
      }
      ]]>
    </style>
  </defs>

